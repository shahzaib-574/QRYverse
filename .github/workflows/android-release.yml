name: QRYverse signed Android candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qryverse-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: play-production
    env:
      QRY_ADMOB_APP_ID: ${{ vars.QRY_ADMOB_APP_ID }}
      VITE_ADMOB_BANNER_ID: ${{ vars.VITE_ADMOB_BANNER_ID }}
      VITE_ADMOB_TEST_MODE: 'false'
      VITE_ADMOB_TEST_DEVICE_IDS: ''
      VITE_ADMOB_CONSENT_DEBUG_GEOGRAPHY: DISABLED
      VITE_QRY_CLOUD_API_URL: ''
      QRY_EXPECTED_APK_CERT_SHA256: ${{ vars.QRY_EXPECTED_APK_CERT_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android API 36 and Build Tools 35
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Materialize the upload keystore
        shell: pwsh
        env:
          QRY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.QRY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:QRY_UPLOAD_KEYSTORE_BASE64)) {
            throw 'QRY_UPLOAD_KEYSTORE_BASE64 is required in the play-production environment.'
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'qryverse-upload.jks'
          [System.IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:QRY_UPLOAD_KEYSTORE_BASE64)
          )
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QRY_UPLOAD_KEYSTORE=$keystorePath"

      - name: Verify source, dependencies, and final Play assets
        run: |
          npm run lint
          npm run test
          npm run server:typecheck -- --noEmit
          npm run server:build
          npm run build
          npm run play:assets:release
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Verify production configuration
        env:
          QRY_UPLOAD_STORE_PASSWORD: ${{ secrets.QRY_UPLOAD_STORE_PASSWORD }}
          QRY_UPLOAD_KEY_ALIAS: ${{ secrets.QRY_UPLOAD_KEY_ALIAS }}
          QRY_UPLOAD_KEY_PASSWORD: ${{ secrets.QRY_UPLOAD_KEY_PASSWORD }}
        run: npm run android:release-preflight

      - name: Build the signed Android App Bundle
        env:
          QRY_UPLOAD_STORE_PASSWORD: ${{ secrets.QRY_UPLOAD_STORE_PASSWORD }}
          QRY_UPLOAD_KEY_ALIAS: ${{ secrets.QRY_UPLOAD_KEY_ALIAS }}
          QRY_UPLOAD_KEY_PASSWORD: ${{ secrets.QRY_UPLOAD_KEY_PASSWORD }}
        run: npm run android:local-bundle

      - name: Verify signing identity and record bundle evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundlePath = 'android/app/build/outputs/bundle/release/app-release.aab'
          if (-not (Test-Path -LiteralPath $bundlePath -PathType Leaf)) {
            throw "Signed bundle was not found: $bundlePath"
          }

          $jarsignerOutput = @(& jarsigner.exe -verify -verbose -certs $bundlePath 2>&1)
          if ($LASTEXITCODE -ne 0 -or ($jarsignerOutput -join "`n") -notmatch '(?i)jar verified') {
            throw 'jarsigner did not verify the Android App Bundle.'
          }

          $certificateOutput = @(& keytool.exe -printcert -rfc -jarfile $bundlePath 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'keytool could not read the bundle signing certificate.' }
          $certificateMatch = [regex]::Match(
            ($certificateOutput -join "`n"),
            '(?s)-----BEGIN CERTIFICATE-----\s*(.*?)\s*-----END CERTIFICATE-----'
          )
          if (-not $certificateMatch.Success) { throw 'The bundle signing certificate could not be parsed.' }
          $certificateBytes = [Convert]::FromBase64String(($certificateMatch.Groups[1].Value -replace '\s', ''))
          $certificateSha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificateBytes))
          $expectedCertificate = ($env:QRY_EXPECTED_APK_CERT_SHA256 -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($expectedCertificate.Length -ne 64) {
            throw 'QRY_EXPECTED_APK_CERT_SHA256 must contain exactly one SHA-256 certificate fingerprint.'
          }
          if ($certificateSha256 -ne $expectedCertificate) {
            throw "Bundle signer SHA-256 does not match QRY_EXPECTED_APK_CERT_SHA256."
          }

          & ./scripts/write-artifact-evidence.ps1 `
            -ArtifactPath @($bundlePath) `
            -OutputDirectory 'output/release-artifact-evidence' `
            -RequireCleanTrackedTree

          $bundleHash = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash
          $signingEvidence = @(
            "Bundle: $bundlePath"
            "Bundle SHA-256: $bundleHash"
            "Upload certificate SHA-256: $certificateSha256"
          )
          New-Item -ItemType Directory -Path 'output/release-signing-evidence' -Force | Out-Null
          Set-Content -LiteralPath 'output/release-signing-evidence/signing-evidence.txt' -Value $signingEvidence -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ### QRYverse signed Android candidate

          Bundle SHA-256: ``$bundleHash``

          Upload certificate SHA-256: ``$certificateSha256``
          "@

      - name: Retain the exact signed candidate
        id: upload-signed-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qryverse-signed-${{ github.sha }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            output/release-artifact-evidence/artifact-evidence.json
            output/release-artifact-evidence/SHA256SUMS.txt
            output/release-signing-evidence/signing-evidence.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record the GitHub artifact digest
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          Artifact archive SHA-256: `${{ steps.upload-signed-candidate.outputs.artifact-digest }}`
          '@

      - name: Remove the temporary upload keystore
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:QRY_UPLOAD_KEYSTORE)) { exit 0 }
          $keystorePath = [System.IO.Path]::GetFullPath($env:QRY_UPLOAD_KEYSTORE)
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if (-not $keystorePath.StartsWith("$runnerTemp\", [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to remove a keystore outside RUNNER_TEMP.'
          }
          if (Test-Path -LiteralPath $keystorePath -PathType Leaf) {
            Remove-Item -LiteralPath $keystorePath -Force
          }
