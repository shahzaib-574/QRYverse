name: QRYverse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qryverse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android API 36 and Build Tools 35
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify web, server, and Play assets
        run: |
          npm run lint
          npm run test
          npm run server:typecheck -- --noEmit
          npm run server:build
          npm run build
          python scripts/prepare-play-screenshots.py

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit the build dependency graph
        run: npm audit --audit-level=high

      - name: Verify Android debug candidate and binary contract
        run: npm run android:local-verify

      - name: Generate immutable artifact evidence
        shell: pwsh
        run: |
          & ./scripts/write-artifact-evidence.ps1 `
            -ArtifactPath @(
              'android/app/build/outputs/apk/debug/app-debug.apk'
              'android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
            ) `
            -OutputDirectory 'output/ci-artifact-evidence' `
            -RequireCleanTrackedTree

      - name: Retain the exact verified debug artifacts
        id: upload-debug-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qryverse-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/*.xml
            output/ci-artifact-evidence/artifact-evidence.json
            output/ci-artifact-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record the GitHub artifact digest
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          ### Verified Android debug artifact

          Archive SHA-256: `${{ steps.upload-debug-artifacts.outputs.artifact-digest }}`
          '@
